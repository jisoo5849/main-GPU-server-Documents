# 메인 GPU 서버 Samba 설정. install/03-samba.sh 가 @MGS_GROUP@ 등의 값을 채워 /etc/samba/smb.conf 로 복사한다.
[global]
   workgroup = WORKGROUP
   server string = main GPU server
   server role = standalone server
   security = user
   map to guest = never
   # Windows 11 기본값과 호환
   server min protocol = SMB2_10
   log file = /var/log/samba/log.%m
   max log size = 1000
   unix extensions = no

# 결과 저장소: 계정이 있는 사용자 누구나 읽기·쓰기
[results]
   path = @MGS_RESULTS@
   valid users = @@MGS_GROUP@
   read only = no
   browseable = yes
   force group = @MGS_GROUP@
   create mask = 0664
   force create mode = 0664
   directory mask = 2775
   force directory mode = 2775
   # 지운 파일은 .recycle/<사용자>/ 에 원래 폴더 구조대로 보관 (지운 날로부터 30일 후 자동 삭제)
   vfs objects = recycle
   recycle:repository = .recycle/%U
   recycle:keeptree = yes
   recycle:versions = yes
   recycle:touch_mtime = yes
   recycle:exclude = *.tmp, ~$*
   recycle:directory_mode = 2775

# 모델 업로드: 여기 넣은 파일은 허브가 검사한 뒤 공용 모델 저장소로 옮긴다
[model-inbox]
   path = @MGS_MODELS@/inbox
   valid users = @@MGS_GROUP@
   read only = no
   force group = @MGS_GROUP@
   create mask = 0664
   directory mask = 2775
