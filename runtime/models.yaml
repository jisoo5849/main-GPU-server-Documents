# 모든 편집·실행 공간이 같이 쓰는 공용 모델 경로 (컨테이너 안 /opt/mgs/models.yaml).
# /srv/models 는 컨테이너에 읽기 전용으로 연결된다.
mgs:
  base_path: /srv/models
  is_default: true
  checkpoints: checkpoints
  diffusion_models: |
    diffusion_models
    unet
  unet: |
    unet
    diffusion_models
  loras: loras
  vae: vae
  text_encoders: |
    text_encoders
    clip
  clip: |
    clip
    text_encoders
  clip_vision: clip_vision
  controlnet: controlnet
  upscale_models: upscale_models
  embeddings: embeddings
  hypernetworks: hypernetworks
  style_models: style_models
  gligen: gligen
  photomaker: photomaker
  audio_encoders: audio_encoders
  model_patches: model_patches
  latent_upscale_models: latent_upscale_models
  vae_approx: vae_approx
  # 2026-10-27 추가: 공식 템플릿이 쓰는 폴더 4종 (얼굴 검출, 프레임 보간, 깊이·법선, 배경 제거)
  detection: detection
  frame_interpolation: frame_interpolation
  geometry_estimation: geometry_estimation
  background_removal: background_removal
  # 허브 연동 노드 (사용자 custom_nodes 와 별도, 읽기 전용)
  custom_nodes: /opt/mgs/nodes
